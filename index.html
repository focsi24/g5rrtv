<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parzivalled — всі посилання</title>
  <meta name="description" content="Parzivalled — контент, ігри, думки. YouTube, Telegram, TikTok, Instagram." />
  <meta name="theme-color" content="#05050f" />

  <!-- Прев'ю посилання (Telegram, Instagram, Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Parzivalled" />
  <meta property="og:description" content="контент · ігри · думки" />
  <meta property="og:url" content="https://g5rrtv.vercel.app/" />
  <meta property="og:image" content="https://g5rrtv.vercel.app/og.jpg" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="avatar.webp" type="image/webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">

  <script>
    // Тема до першого малювання — без блимання
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    })();
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #0057B7;
      --yellow: #FFD700;
      --bg: #05050f;
      --surface: #0d0d20;
      --text: #f0f0ff;
      --muted: rgba(240,240,255,0.55);
      --g1: #FFD700;
      --g2: #ffffff;
      --g3: #3a8dff;
    }
    html.light {
      --bg: #f4f4f8;
      --surface: #ffffff;
      --text: #0a0a1a;
      --muted: rgba(10,10,26,0.6);
      --g1: #c99a00;
      --g2: #1a1a3a;
      --g3: #0057B7;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Onest', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── BACKGROUND IMAGE ── */
    :root { --ov1: rgba(5,5,15,0.3); --ov2: rgba(5,5,15,0.65); }
    html.light { --ov1: rgba(244,244,248,0.82); --ov2: rgba(244,244,248,0.92); }

    .bg-image { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-image::before {            /* повільний дрейф картинки */
      content: ''; position: absolute; inset: -6%;
      background: url("bg.jpg") center 20% / cover no-repeat;
      animation: kenburns 45s ease-in-out infinite alternate;
      will-change: transform;
    }
    .bg-image::after {             /* затемнення */
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(var(--ov1), var(--ov2));
    }
    @keyframes kenburns {
      from { transform: scale(1)    translate(0, 0); }
      to   { transform: scale(1.12) translate(-2.5%, 3%); }
    }

    /* ── PARTICLES ── */
    #fx { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ── GRAIN ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
    }

    /* ── BACKGROUND GLOW ── */
    .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-glow span {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.1;
      will-change: transform;
    }
    html.light .bg-glow span { opacity: 0.1; }
    .bg-glow span:nth-child(1) {
      width: 600px; height: 600px; background: var(--blue);
      top: -150px; left: -150px;
      animation: drift1 16s ease-in-out infinite alternate;
    }
    .bg-glow span:nth-child(2) {
      width: 500px; height: 500px; background: var(--yellow);
      bottom: -120px; right: -100px;
      animation: drift2 12s ease-in-out infinite alternate; animation-delay: -5s;
    }
    .bg-glow span:nth-child(3) {
      width: 300px; height: 300px; background: #ff6a2b;
      top: calc(50% - 150px); left: calc(50% - 150px);
      animation: drift3 10s ease-in-out infinite alternate; animation-delay: -3s;
    }
    @keyframes drift1 { to { transform: translate(50px, 40px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-40px, -30px) scale(1.08); } }
    @keyframes drift3 { to { transform: translate(30px, -25px) scale(1.12); } }

    /* ── FLAG STRIPE ── */
    .flag-stripe {
      position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 100;
      background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 50%);
    }

    /* ── LAYOUT ── */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 24px 48px;
    }

    /* ── AVATAR ── */
    .avatar {
      position: relative;
      width: 132px; height: 132px;
      margin-bottom: 26px;
      opacity: 0; animation: fadeUp 0.7s 0.1s ease forwards;
    }
    .avatar::before {            /* кільце, що обертається */
      content: '';
      position: absolute; inset: -5px; border-radius: 50%;
      background: conic-gradient(var(--yellow), var(--blue), var(--yellow));
      animation: spin 8s linear infinite;
    }
    .avatar::after {             /* відступ між кільцем і картинкою */
      content: '';
      position: absolute; inset: -1px; border-radius: 50%;
      background: var(--bg);
      transition: background 0.3s ease;
    }
    .avatar img {
      position: absolute; inset: 2px; z-index: 1;
      width: calc(100% - 4px); height: calc(100% - 4px);
      border-radius: 50%; object-fit: cover; display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── NAME ── */
    .name {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 900; letter-spacing: -0.02em; line-height: 1.1;
      margin-bottom: 10px;
      opacity: 0; animation: fadeUp 0.7s 0.2s ease forwards;
    }
    .name span {
      background: linear-gradient(100deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .bio {
      font-size: 0.95rem; color: var(--muted);
      margin-bottom: 38px; letter-spacing: 0.04em;
      opacity: 0; animation: fadeUp 0.7s 0.3s ease forwards;
    }

    /* ── LINKS ── */
    .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }

    .btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; border-radius: 16px;
      text-decoration: none; color: #fff;
      position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0); transition: background 0.25s ease;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn:hover::before { background: rgba(255,255,255,0.08); }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    .btn svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; position: relative; z-index: 1; }
    .btn-text { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px; }
    .btn-label { font-family: 'Unbounded', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; }
    .btn-desc { font-size: 0.78rem; font-weight: 400; opacity: 0.85; }

    .btn:nth-child(1) { animation: fadeUp 0.6s 0.4s ease forwards; }
    .btn:nth-child(2) { animation: fadeUp 0.6s 0.5s ease forwards; }
    .btn:nth-child(3) { animation: fadeUp 0.6s 0.6s ease forwards; }
    .btn:nth-child(4) { animation: fadeUp 0.6s 0.7s ease forwards; }

    .yt { background: linear-gradient(135deg, #c4000a 0%, #ff2200 100%); box-shadow: 0 8px 30px rgba(255,34,0,0.25); }
    .tg { background: linear-gradient(135deg, #006aa8 0%, #29b6f6 100%); box-shadow: 0 8px 30px rgba(41,182,246,0.2); }
    .tt { background: linear-gradient(135deg, #111 0%, #2a2a2a 100%); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    .ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); box-shadow: 0 8px 30px rgba(253,29,29,0.2); }

    /* ── FOOTER ── */
    .footer {
      margin-top: 40px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em;
      opacity: 0; animation: fadeUp 0.6s 0.9s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── THEME TOGGLE ── */
    .theme-btn {
      position: fixed; top: 18px; right: 18px; z-index: 200;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--surface);
      border: 1px solid rgba(128,128,160,0.25);
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .theme-btn:hover { transform: scale(1.08); }
    .theme-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .avatar, .name, .bio, .btn, .footer { opacity: 1 !important; }
      #fx { display: none; }
    }
  </style>
</head>
<body>

    <p class="footer">© <span id="year">2026</span> Parzivalled</p>
  </main>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const meta = document.querySelector('meta[name="theme-color"]');

    // Іконка показує, на яку тему перемкнеться
    function render() {
      const light = root.classList.contains('light');
      btn.textContent = light ? '🌙' : '☀️';
      meta.setAttribute('content', light ? '#f4f4f8' : '#05050f');
    }
    render();

    btn.addEventListener('click', () => {
      root.classList.toggle('light');
      try { localStorage.setItem('theme', root.classList.contains('light') ? 'light' : 'dark'); } catch (e) {}
      render();
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    // ── Частинки (іскри, що пливуть угору) ──
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const c = document.getElementById('fx'), ctx = c.getContext('2d');
      let w, h, dpr, parts = [];
      const rnd = (a, b) => a + Math.random() * (b - a);

      function spawn(initial) {
        return {
          x: rnd(0, w),
          y: initial ? rnd(0, h) : h + 10,
          r: rnd(0.8, 2.6),
          vy: rnd(0.15, 0.6),
          vx: rnd(-0.15, 0.15),
          a: rnd(0.25, 0.8),
          ph: rnd(0, 6.28),
          hue: Math.random() < 0.7 ? 345 : 45   // рожевий / золотий
        };
      }
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        c.width = w * dpr; c.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = w < 600 ? 28 : 55;
        parts = Array.from({ length: n }, () => spawn(true));
      }
      function tick(t) {
        ctx.clearRect(0, 0, w, h);
        const light = document.documentElement.classList.contains('light');
        for (const p of parts) {
          p.y -= p.vy;
          p.x += p.vx + Math.sin(t / 1500 + p.ph) * 0.2;
          if (p.y < -10) Object.assign(p, spawn(false));
          const fade = Math.min(1, p.y / (h * 0.25), (h - p.y) / 60 + 0.2);
          const tw = 0.6 + 0.4 * Math.sin(t / 600 + p.ph);
          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 100%, ${light ? 45 : 70}%, ${p.a * tw * Math.max(fade, 0) * (light ? 0.5 : 1)})`;
          ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, 0.9)`;
          ctx.shadowBlur = 8;
          ctx.arc(p.x, p.y, p.r, 0, 6.283);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener('resize', resize);
      resize();
      requestAnimationFrame(tick);
    })();

  </script>
